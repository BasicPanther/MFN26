[build]
  command = "npm install"
  functions = "netlify/functions"
  publish = "."

[build]
  command = "npm run build"
  publish = "."
  functions = "netlify/functions"

[env.production]
  variables = { ENVIRONMENT = "production" }

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200


[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
